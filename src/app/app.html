<main class="min-h-screen bg-slate-50">
  <h1 class="p-6 text-2xl font-bold text-blue-600">Shipment Booking</h1>
  <router-outlet />
</main>

@if (notifications.message(); as message) {
  <div
    role="alert"
    class="fixed bottom-4 left-1/2 flex max-w-sm -translate-x-1/2 items-center gap-3 rounded-lg bg-red-600 px-4 py-3 text-sm text-white shadow-lg"
  >
    <span>{{ message }}</span>
    <button type="button" (click)="notifications.dismiss()" aria-label="Tutup">✕</button>
  </div>
}
