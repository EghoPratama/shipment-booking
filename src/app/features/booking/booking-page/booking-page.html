<section>
  <h2 class="mb-4 text-xl font-semibold text-slate-800">Alamat Penerima</h2>

  @if (errorMessage(); as message) {
    <p class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-700">{{ message }}</p>
  }

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="space-y-4 rounded-xl bg-white p-6 shadow"
  >
    <div>
      <label for="recipient-name" class="mb-1 block text-sm font-medium text-slate-700">
        Nama Penerima
      </label>
      <input
        id="recipient-name"
        type="text"
        formControlName="name"
        class="w-full rounded-md border border-slate-300 px-3 py-2"
      />
    </div>

    <div>
      <label for="street" class="mb-1 block text-sm font-medium text-slate-700">
        Alamat Lengkap
      </label>
      <input
        id="street"
        type="text"
        formControlName="street"
        placeholder="Nama jalan, nomor rumah, RT/RW"
        class="w-full rounded-md border border-slate-300 px-3 py-2"
      />
    </div>

    <div>
      <label for="province" class="mb-1 block text-sm font-medium text-slate-700">Provinsi</label>
      <select
        id="province"
        formControlName="provinceId"
        class="w-full rounded-md border border-slate-300 px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400"
      >
        <option value="" disabled>Pilih provinsi</option>
        @for (item of provinces(); track item.id) {
          <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <div>
      <label for="regency" class="mb-1 block text-sm font-medium text-slate-700">
        Kota / Kabupaten
      </label>
      <select
        id="regency"
        formControlName="regencyId"
        class="w-full rounded-md border border-slate-300 px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400"
      >
        <option value="" disabled>
          {{ loadingRegencies() ? 'Memuat...' : 'Pilih kota / kabupaten' }}
        </option>
        @for (item of regencies(); track item.id) {
          <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <div>
      <label for="district" class="mb-1 block text-sm font-medium text-slate-700">Kecamatan</label>
      <select
        id="district"
        formControlName="districtId"
        class="w-full rounded-md border border-slate-300 px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400"
      >
        <option value="" disabled>
          {{ loadingDistricts() ? 'Memuat...' : 'Pilih kecamatan' }}
        </option>
        @for (item of districts(); track item.id) {
          <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <div>
      <label for="village" class="mb-1 block text-sm font-medium text-slate-700">Kelurahan</label>
      <select
        id="village"
        formControlName="villageId"
        class="w-full rounded-md border border-slate-300 px-3 py-2 disabled:bg-slate-100 disabled:text-slate-400"
      >
        <option value="" disabled>
          {{ loadingVillages() ? 'Memuat...' : 'Pilih kelurahan' }}
        </option>
        @for (item of villages(); track item.id) {
          <option [value]="item.id">{{ item.name }}</option>
        }
      </select>
    </div>

    <div class="flex gap-3">
      <button
        type="button"
        (click)="back()"
        class="w-1/3 rounded-md border border-slate-300 px-4 py-2 font-medium text-slate-700 cursor-pointer"
      >
        Kembali
      </button>
      <button
        type="submit"
        [disabled]="!isComplete()"
        class="w-2/3 rounded-md bg-blue-600 px-4 py-2 font-medium text-white disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer"
      >
        Lanjut
      </button>
    </div>
  </form>
</section>
